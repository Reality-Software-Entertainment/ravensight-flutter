name: ravensight_core
description: The pure Dart core of the Ravensight Flutter SDK. Games use the ravensight package.
version: 0.2.0
homepage: https://ravensight.io
repository: https://github.com/Reality-Software-Entertainment/ravensight-flutter
# Comes with the ravensight package from the same repository and tag; never
# published to a package registry.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
