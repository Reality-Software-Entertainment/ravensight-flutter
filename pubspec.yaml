name: ravensight
description: Ravensight player analytics for Flutter games. Sessions, events, retention, levels, purchases, errors, ads, attribution, remote config and experiments.
version: 0.1.0
homepage: https://ravensight.io
repository: https://github.com/Reality-Software-Entertainment/ravensight-flutter
# Installed from the public git repository at a tag; never published to a
# package registry.
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  ravensight_core:
    path: packages/ravensight_core
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
