name: ravensight_example
description: A small Flutter game screen wired to Ravensight.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own Material library is deprecated (after 3.47) in favour of
  # this package; the example's app bar, buttons and switch come from it.
  material_ui: ^1.0.0
  ravensight:
    path: ..

dev_dependencies:
  flutter_lints: ^5.0.0
